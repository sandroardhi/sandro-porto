      // Drives the loading screen. The app reports real milestones through window.__loader.set(0..1) and calls
      // done() once the glass is on screen; between milestones the counter creeps so it never sits still.

            el.classList.add('hi', 'out')
            setTimeout(function () { d.documentElement.classList.remove('is-loading') }, 220)
            setTimeout(function () { el.remove() }, 1300); return

            if (kick) { kick.style.animation = 'none'; kick.style.opacity = '0' }

            setTimeout(function () { d.documentElement.classList.remove('is-loading') }, 220)
